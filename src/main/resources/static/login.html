<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SIGARH - Connexion</title>

    <link rel="stylesheet"
          href="css/login.css">

    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
<div class="background">

    <div class="login-card">

      <div class="logo">
        <img src="images/logo.png" alt="Logo SIGARH">
      </div>

        <h1>SIGARH</h1>

        <p>Système Informatique de Gestion des Ressources Humaines</p>

        <form id="loginForm">

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                        type="number"
                        id="matriculeAdmin"
                        placeholder="Matricule">

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                        type="password"
                        id="password"
                        placeholder="Mot de passe"
                        required>

            </div>

            <button type="submit">

                Se connecter

            </button>

        </form>

        <div id="message"></div>

        <div class="register-link">

            Vous n'avez pas de compte ?

            <a href="register.html">

                Créer un compte

            </a>

        </div>

    </div>

</div>

<script src="/../js/login.js"></script>

</body>

</html>
