<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SIGARH - Création de compte</title>

    <link rel="stylesheet" href="css/register.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


<div class="background">


    <div class="register-card">


        <!-- Logo -->

        <div class="logo">

            <img src="images/logo.png" alt="Logo SIGARH">

        </div>



        <h1>SIGARH</h1>

        <p>
            Création d'un nouveau compte administrateur
        </p>



        <form id="registerForm">


            <!-- ==========================
                    Nom + Prénom
            =========================== -->


            <div class="form-row">


                <div class="field">


                    <div class="input-box">


                        <i class="fa-solid fa-user"></i>


                        <input
                                type="text"
                                id="nom"
                                placeholder="Nom">


                    </div>


                    <small id="nomError"></small>


                </div>




                <div class="field">


                    <div class="input-box">


                        <i class="fa-solid fa-user"></i>


                        <input
                                type="text"
                                id="prenom"
                                placeholder="Prénom">


                    </div>


                    <small id="prenomError"></small>


                </div>


            </div>





            <!-- ==========================
                 Username + Email
            =========================== -->


            <div class="form-row">


                <div class="field">


                    <div class="input-box">


                        <i class="fa-solid fa-circle-user"></i>


                        <input
                                type="number"
                                id="matriculeAdmin"
                                placeholder="Matricule">


                    </div>


                    <small id="matriculeAdminError"></small>


                </div>





                <div class="field">


                    <div class="input-box">


                        <i class="fa-solid fa-envelope"></i>


                        <input
                                type="email"
                                id="email"
                                placeholder="Adresse email">


                    </div>


                    <small id="emailError"></small>


                </div>


            </div>







            <!-- ==========================
               Mot de passe + Confirmation
            =========================== -->


            <div class="form-row">



                <!-- Mot de passe -->


                <div class="field">


                    <div class="input-box">


                        <i class="fa-solid fa-lock"></i>



                        <input
                                type="password"
                                id="password"
                                placeholder="Mot de passe">



                        <span id="togglePassword">


                            <i class="fa-solid fa-eye"></i>


                        </span>


                    </div>



                    <small id="passwordError"></small>



                </div>







                <!-- Confirmation -->


                <div class="field">


                    <div class="input-box">


                        <i class="fa-solid fa-lock"></i>



                        <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirmer le mot de passe">



                        <span id="toggleConfirmPassword">


                            <i class="fa-solid fa-eye"></i>


                        </span>


                    </div>



                    <small id="confirmPasswordError"></small>


                    <!-- Check live -->

                    <div id="passwordMatch"></div>



                </div>



            </div>







            <!-- ==========================
               Force mot de passe
            =========================== -->


            <div class="password-strength">


                <div id="strengthBar"></div>


            </div>



            <div id="strengthText"></div>







            <!-- ==========================
                    Bouton
            =========================== -->


            <button type="submit">


                <i class="fa-solid fa-user-plus"></i>


                Créer un compte


            </button>




        </form>






        <!-- Message serveur -->


        <div id="message"></div>






        <!-- Retour connexion -->


        <div class="login-link">


            Vous avez déjà un compte ?


            <a href="login.html">

                Se connecter

            </a>


        </div>




    </div>


</div>





<script src="../js/register.js"></script>


</body>


</html>
